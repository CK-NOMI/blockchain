<!DOCTYPE html>

<html class="light" lang="en"><head>

                        "surface-container-low": "#eff4ff",

                        "tertiary": "#006a2c",
                        "on-primary-fixed-variant": "#00429a",

                        "tertiary-fixed": "#7ffc97",

                        "surface-tint": "#0058c9",
                        "inverse-surface": "#213145",
                        "secondary-container": "#9fbeff",

                        "DEFAULT": "0.125rem",

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-background min-h-screen flex items-center justify-center font-body-md text-body-md text-on-background relative">
<!-- Blurred Background Context -->
<div class="absolute inset-0 z-0 bg-[url('https://images.unsplash.com/photo-1586771107445-d3ca888129ff?auto=format&amp;fit=crop&amp;q=80&amp;w=2000')] bg-cover bg-center opacity-10" data-alt="blurred agricultural data dashboard showing complex supply chain nodes and analytics graphs in a professional setting"></div>
<div class="absolute inset-0 z-0 bg-surface-variant/40 backdrop-blur-sm"></div>
<!-- Modal Container -->
<main class="relative z-10 w-full max-w-[480px] p-md">
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] overflow-hidden">
<!-- Top Branding / Accent -->
<div class="h-1 bg-primary w-full"></div>
<div class="p-xl flex flex-col items-center text-center">
<!-- Icon Container -->
<div class="w-16 h-16 bg-error-container/30 rounded-full flex items-center justify-center mb-lg">
<span class="material-symbols-outlined text-error text-3xl">logout</span>
</div>
<!-- Content -->
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-sm">确认退出登录？</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-lg max-w-[360px]">
                    Are you sure you want to end your current session and exit the Agri-Chain Management Portal?
                </p>
<!-- Warning Alert -->
<div class="flex items-start gap-sm bg-surface-container-low border border-outline-variant/50 p-md rounded-lg w-full mb-xl text-left">
<span class="material-symbols-outlined text-outline fill-icon flex-shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-md text-body-md text-on-surface-variant">
                        Unsaved changes in active forms or tracking updates may be lost upon exit.
                    </p>
</div>
<!-- Actions -->
<div class="flex flex-col w-full gap-sm">
<button class="w-full bg-error text-on-error font-label-sm text-label-sm py-3 px-6 rounded-lg hover:bg-error/90 transition-colors shadow-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">exit_to_app</span>
                        Yes, Log Out
                    </button>
<button class="w-full bg-transparent border border-primary text-primary font-label-sm text-label-sm py-3 px-6 rounded-lg hover:bg-primary/5 transition-colors flex items-center justify-center gap-2">
                        No, Stay Logged In
                    </button>
</div>
</div>
<!-- Footer Note -->
<div class="bg-surface-container-low px-md py-sm border-t border-outline-variant/30 text-center">
<p class="font-label-sm text-label-sm text-outline">AgriTrace Pro System Security</p>
</div>
</div>
</main>
